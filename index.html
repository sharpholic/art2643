<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>샤프쌤 미술관의 비밀 · 명화 감상 방탈출</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gowun+Dodum&family=Nanum+Myeongjo:wght@700;800&family=Nanum+Pen+Script&family=Special+Elite&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#0a0806; --ink:#1d1611; --paper:#eadcbf; --paper2:#d9c7a1; --red:#b3121b; --red2:#e0313a;
  --gold:#d9a845; --gold2:#ffd677; --green:#3fbf6f; --muted:#8c7a62;
  --title:'Black Han Sans','Noto Sans KR',sans-serif;
  --body:'Gowun Dodum','Noto Sans KR','Apple SD Gothic Neo',sans-serif;
  --story:'Nanum Myeongjo','Noto Serif KR',serif;
  --hand:'Nanum Pen Script',cursive;
  --type:'Special Elite',monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:#f3e9d6;font-family:var(--body);overflow:hidden;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;border:none}
#stage{position:fixed;inset:0;display:flex;flex-direction:column;
  background:
   radial-gradient(ellipse at 50% -10%, rgba(255,214,140,.16), transparent 55%),
   radial-gradient(ellipse at 50% 120%, rgba(120,20,20,.25), transparent 60%),
   repeating-linear-gradient(90deg, #120e0a 0 46px, #15100c 46px 92px);
}
/* film grain + vignette */
#grain{position:fixed;inset:-50%;pointer-events:none;z-index:900;opacity:.09;animation:grain 1s steps(6) infinite}
@keyframes grain{0%{transform:translate(0,0)}20%{transform:translate(-8%,4%)}40%{transform:translate(6%,-6%)}60%{transform:translate(-4%,8%)}80%{transform:translate(8%,2%)}100%{transform:translate(0,0)}}
#vignette{position:fixed;inset:0;pointer-events:none;z-index:899;background:radial-gradient(ellipse at center, transparent 45%, rgba(0,0,0,.75) 100%)}
#dust{position:fixed;inset:0;pointer-events:none;z-index:2}

/* HUD */
#hud{position:relative;z-index:50;display:none;align-items:center;gap:12px;padding:10px 16px;
  background:linear-gradient(#000c,#0000);}
#hud.show{display:flex}
#logo{font-family:var(--title);font-size:20px;color:var(--gold);letter-spacing:1px;white-space:nowrap;padding:6px 8px;border:1px solid #d9a84555;border-radius:6px}
#teamTag{font-size:15px;color:#e8d9bb;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:22vw}
#keys{display:flex;gap:5px;margin-left:auto}
.kslot{width:30px;height:34px;border:1.5px dashed #8c7a6288;border-radius:5px;display:grid;place-items:center;font-family:var(--title);font-size:18px;color:#0000;background:#0006;position:relative}
.kslot.got{border:1.5px solid var(--gold);color:var(--gold2);background:radial-gradient(#5a3a10,#1d1206);box-shadow:0 0 10px #d9a84588}
.kslot small{position:absolute;top:-2px;left:2px;font-size:9px;color:#8c7a62;font-family:var(--body)}
#timer{font-family:var(--type);font-size:28px;color:var(--gold2);background:#000a;border:1px solid #d9a84566;padding:2px 12px;border-radius:6px;min-width:110px;text-align:center;text-shadow:0 0 10px #ffb34788}
#timer.danger{color:#ff4a4a;border-color:#ff4a4a;animation:pulseR 1s infinite}
#timer.over{color:#ff4a4a}
@keyframes pulseR{50%{box-shadow:0 0 18px #ff2a2aaa}}
#soundBtn{background:#0008;color:#e8d9bb;border:1px solid #fff3;border-radius:6px;font-size:18px;width:40px;height:38px}

#app{position:relative;z-index:10;flex:1;overflow-y:auto;overflow-x:hidden;padding:12px 16px 40px;-webkit-overflow-scrolling:touch}
.wrap{max-width:860px;margin:0 auto}
.screen{animation:fadeIn .6s ease both}
@keyframes fadeIn{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}

/* paper card */
.paper{position:relative;background:
   radial-gradient(ellipse at 20% 10%, #f6ecd5 0%, transparent 60%),
   radial-gradient(ellipse at 90% 90%, #c9b083 0%, transparent 55%),
   linear-gradient(135deg,var(--paper),var(--paper2));
  color:var(--ink);border-radius:4px;padding:26px 26px 24px;
  box-shadow:0 18px 40px #000c, inset 0 0 60px #8a6a3a55;}
.paper::before{content:"";position:absolute;inset:0;pointer-events:none;border-radius:4px;
  background:repeating-linear-gradient(0deg, transparent 0 3px, #00000006 3px 4px);}
.tape{position:absolute;width:110px;height:28px;background:#f3ecd9bb;top:-12px;left:50%;transform:translateX(-50%) rotate(-3deg);box-shadow:0 2px 4px #0003}
.stamp{position:absolute;right:18px;top:16px;font-family:var(--type);color:var(--red);border:3px solid var(--red);padding:3px 10px;transform:rotate(8deg);font-size:15px;letter-spacing:2px;opacity:.85}
.stamp.big{font-size:22px}
.roomTitle{font-family:var(--title);color:var(--red);font-size:44px;margin:4px 0 6px;letter-spacing:2px;text-shadow:1px 1px 0 #0002}
.sub{font-family:var(--type);color:#6d5a40;font-size:14px;letter-spacing:2px}
.story{font-family:var(--story);font-size:20px;line-height:1.75;min-height:3em;white-space:pre-line;font-weight:700}
.caret::after{content:"▌";animation:blink .8s steps(1) infinite;color:var(--red)}
@keyframes blink{50%{opacity:0}}

.findBox{margin-top:18px;background:#1d1611;color:#f2e4c6;padding:14px 16px 14px 62px;border-radius:6px;position:relative;font-size:19px;line-height:1.5}
.findBox::before{content:"🔎";position:absolute;left:16px;top:50%;transform:translateY(-50%);font-size:30px}
.findBox b{color:var(--gold2)}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font-family:var(--title);font-size:22px;letter-spacing:1px;
  padding:14px 26px;border-radius:8px;color:#fff;background:linear-gradient(#c81e27,#8d0d14);
  box-shadow:0 5px 0 #4d0509, 0 10px 20px #0008;transition:transform .08s}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #4d0509}
.btn.gold{background:linear-gradient(#e7b850,#a9761d);color:#1d1206;box-shadow:0 5px 0 #5e3f0b,0 10px 20px #0008}
.btn.dark{background:linear-gradient(#3a3027,#1f1913);box-shadow:0 5px 0 #000,0 10px 20px #0008;color:#e8d9bb}
.btn.ghost{background:transparent;border:2px solid #d9a84588;color:var(--gold2);box-shadow:none}
.btn[disabled]{filter:grayscale(1) brightness(.6);pointer-events:none}
.center{text-align:center}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin-top:20px}

/* intro */
#intro{position:fixed;inset:0;z-index:100;background:#000;display:flex;align-items:center;justify-content:center;flex-direction:column;overflow:hidden}
#intro .scene{position:absolute;inset:0;background:
   radial-gradient(ellipse at 50% 30%, #3b2a1a 0%, #0b0806 60%),
   repeating-linear-gradient(90deg,#1a130d 0 60px,#140f0a 60px 120px);}
#intro .frames{position:absolute;inset:0}
#intro .frame{position:absolute;border:10px solid #6b4c1f;box-shadow:inset 0 0 0 3px #c79a45, 0 10px 30px #000;background:#222 center/cover;filter:grayscale(1) brightness(.75)}
#flash{position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle 170px at var(--x,50%) var(--y,50%), transparent 0, transparent 60%, rgba(0,0,0,.97) 100%)}
#intro .ttl{position:relative;z-index:3;text-align:center;pointer-events:none}
.glitch{font-family:var(--title);font-size:min(13vw,92px);color:#f5e7c8;letter-spacing:4px;position:relative;text-shadow:0 0 30px #ffb34755}
.glitch::before,.glitch::after{content:attr(data-t);position:absolute;inset:0}
.glitch::before{color:#ff2a3a;transform:translate(3px,0);clip-path:inset(0 0 60% 0);animation:gl 2.4s infinite}
.glitch::after{color:#29e0ff;transform:translate(-3px,0);clip-path:inset(55% 0 0 0);animation:gl 2.1s infinite reverse}
@keyframes gl{0%,86%{transform:translate(0);opacity:0}88%{opacity:.9;transform:translate(-6px,2px)}92%{transform:translate(6px,-2px)}96%{transform:translate(-3px,0);opacity:.9}100%{opacity:0}}
.introSub{font-family:var(--type);color:var(--gold);letter-spacing:6px;margin-top:6px;font-size:16px}
#intro .go{position:relative;z-index:3;margin-top:40px;pointer-events:auto}
.tapHint{position:relative;z-index:3;margin-top:16px;color:#a99577;font-size:15px;animation:blink 1.6s infinite}
.police{position:absolute;z-index:2;left:-10%;width:120%;height:40px;background:repeating-linear-gradient(-45deg,#f2c400 0 30px,#1a1a1a 30px 60px);display:flex;align-items:center;overflow:hidden;box-shadow:0 6px 18px #000a;opacity:.9}
.police span{font-family:var(--title);color:#111;background:#f2c400;padding:0 14px;margin:0 30px;white-space:nowrap;letter-spacing:3px}

/* rules */
.rules{list-style:none;padding:0;margin:14px 0 0;display:grid;gap:10px}
.rules li{display:flex;gap:12px;align-items:flex-start;font-size:18px;line-height:1.45;background:#0000000c;padding:10px 12px;border-left:4px solid var(--red)}
.rules li span{font-size:24px}

/* setup */
.teamGrid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:16px 0}
.teamBtn{font-family:var(--title);font-size:30px;padding:16px 0;border-radius:8px;background:#1d1611;color:#e9d9b8;border:2px solid #4a3a28}
.teamBtn.sel{background:var(--red);border-color:#ffb3b3;color:#fff;box-shadow:0 0 18px #e0313a99}
.inp{width:100%;font-size:22px;padding:12px 14px;border-radius:6px;border:2px solid #6d5a40;background:#fffaf0;font-family:var(--body);color:var(--ink)}

/* map */
.mapHead{display:flex;align-items:flex-end;justify-content:space-between;margin:6px 0 14px}
.mapHead h2{font-family:var(--title);font-size:32px;margin:0;color:var(--gold2);letter-spacing:2px}
.mapHead p{margin:0;color:#b9a585}
.doors{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}
@media (max-width:640px){.doors{grid-template-columns:repeat(2,1fr)}.teamGrid{grid-template-columns:repeat(4,1fr)}.roomTitle{font-size:34px}}
.door{position:relative;aspect-ratio:3/4;border-radius:70px 70px 6px 6px;background:
  linear-gradient(90deg,#2b1d12,#3b291a 50%,#2b1d12);border:5px solid #5a4126;
  box-shadow:inset 0 0 0 3px #1a110a, inset 0 -30px 40px #000a, 0 10px 20px #000a;overflow:hidden;color:#e8d9bb;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:10px 6px 12px;text-align:center}
.door .num{position:absolute;top:14px;left:50%;transform:translateX(-50%);font-family:var(--type);font-size:13px;color:#c79a45;border:1px solid #c79a4577;padding:1px 8px;border-radius:10px;background:#0007;z-index:2}
.door .nm{font-family:var(--title);font-size:21px;z-index:2;text-shadow:0 2px 6px #000}
.door .st{font-size:13px;color:#b9a585;z-index:2;margin-top:3px}
.door .icon{font-size:42px;margin-bottom:auto;margin-top:46px;z-index:2;filter:drop-shadow(0 4px 6px #000)}
.door .art{position:absolute;inset:0;background:center/cover;opacity:.9}
.door .art::after{content:"";position:absolute;inset:0;background:linear-gradient(transparent 40%,#000d)}
.door.locked{filter:brightness(.55) saturate(.6)}
.door.locked .icon{opacity:.6}
.door.now{border-color:var(--gold);animation:doorGlow 1.6s ease-in-out infinite;cursor:pointer}
.door.now .st{color:var(--gold2);font-weight:bold}
@keyframes doorGlow{50%{box-shadow:inset 0 0 0 3px #1a110a, 0 0 30px #ffc85099, 0 0 60px #ffb34755}}
.door.done{border-color:#3fbf6f}
.door .keyb{position:absolute;top:44px;right:10px;z-index:3;background:var(--gold);color:#1d1206;font-family:var(--title);width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-size:22px;box-shadow:0 0 12px #ffd677}
.exitDoor{margin:22px auto 0;max-width:520px;padding:18px;border-radius:10px;border:3px solid #5a4126;background:linear-gradient(#1b130c,#0d0906);text-align:center;color:#8c7a62;font-family:var(--title);font-size:24px}
.exitDoor.open{border-color:var(--gold);color:var(--gold2);animation:doorGlow 1.4s infinite;cursor:pointer}

/* mission */
.mprog{display:flex;gap:8px;justify-content:center;margin:2px 0 14px}
.mprog i{width:34px;height:8px;border-radius:4px;background:#ffffff22}
.mprog i.on{background:var(--gold)}
.mprog i.ok{background:var(--green)}
.qcard .qlabel{font-family:var(--type);color:var(--red);font-size:15px;letter-spacing:3px}
.qcard .q{font-size:24px;line-height:1.55;margin:6px 0 4px;font-weight:bold;white-space:pre-line}
.qcard .tip{font-size:16px;color:#6d5a40;margin-top:4px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
@media (max-width:560px){.opts{grid-template-columns:1fr}}
.opt{display:flex;align-items:center;gap:12px;text-align:left;font-size:20px;line-height:1.35;padding:14px 14px;border-radius:8px;background:#fffaf0;color:var(--ink);border:2px solid #b49a70;box-shadow:0 4px 0 #8a7350;font-family:var(--body);font-weight:bold}
.opt:active{transform:translateY(3px);box-shadow:0 1px 0 #8a7350}
.opt b{flex:none;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--ink);color:var(--gold2);font-family:var(--title);font-size:18px}
.opt[disabled]{opacity:.45}
.opt.right{background:#d8f7e0;border-color:var(--green)}
.opt.wrong{background:#ffd9d9;border-color:var(--red);animation:shake .4s}
.keypadWrap{display:flex;flex-direction:column;align-items:center;margin-top:14px}
.display{display:flex;gap:10px;margin-bottom:14px}
.display span{width:58px;height:70px;border-radius:8px;background:#100c08;border:2px solid #6d5a40;display:grid;place-items:center;font-family:var(--type);font-size:40px;color:var(--gold2);text-shadow:0 0 12px #ffb347}
.display span.fill{border-color:var(--gold)}
.keypad{display:grid;grid-template-columns:repeat(3,84px);gap:10px}
.key{height:66px;border-radius:10px;font-family:var(--type);font-size:30px;color:#efe2c8;background:linear-gradient(#3b3129,#211a14);box-shadow:0 5px 0 #000, inset 0 1px 0 #ffffff22}
.key:active{transform:translateY(4px);box-shadow:0 1px 0 #000}
.key.ok{background:linear-gradient(#c81e27,#8d0d14);font-family:var(--title);font-size:22px}
.key.del{font-size:22px}
.dials{display:flex;gap:18px;justify-content:center;margin-top:16px}
.dial{display:flex;flex-direction:column;align-items:center;gap:8px}
.dial .sw{width:80px;height:26px;border:3px solid #111}
.dial button{width:80px;height:46px;border-radius:8px;background:#211a14;color:#efe2c8;font-size:24px;box-shadow:0 4px 0 #000}
.dial .v{width:80px;height:84px;border:4px solid #111;background:#fff;color:#111;display:grid;place-items:center;font-family:var(--type);font-size:50px}
.hintRow{display:flex;justify-content:space-between;align-items:center;margin-top:18px;gap:10px;flex-wrap:wrap}
.hintBtn{background:#1d1611;color:var(--gold2);border:1.5px dashed var(--gold);padding:10px 14px;border-radius:8px;font-size:17px}
.hintBox{margin-top:12px;background:#fff6c9;border:2px dashed #b38b1f;color:#4a3a10;padding:12px 14px;border-radius:6px;font-size:18px;line-height:1.5;display:none}
.hintBox.show{display:block;animation:fadeIn .4s}
.hintBox p{margin:4px 0}
.explain{margin-top:14px;background:#e6f7e9;border-left:6px solid var(--green);padding:12px 14px;font-size:18px;line-height:1.55;color:#173b22;border-radius:4px}

/* overlays */
.ov{position:fixed;inset:0;z-index:500;display:flex;align-items:center;justify-content:center;flex-direction:column;text-align:center;padding:20px}
.alarm{background:radial-gradient(circle,#7a0008ee,#200002f5);animation:alarmBg .5s infinite alternate}
@keyframes alarmBg{to{background:radial-gradient(circle,#c4000ef0,#3a0004f5)}}
.alarm h1{font-family:var(--title);font-size:min(12vw,70px);margin:0;color:#fff;letter-spacing:4px;text-shadow:0 0 20px #f00}
.alarm p{font-size:22px;color:#ffd6d6}
.alarm .cd{font-family:var(--type);font-size:90px;color:#fff}
.siren{font-size:80px;animation:spin .6s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.shake{animation:shake .45s}
.okFlash{position:fixed;inset:0;z-index:480;pointer-events:none;background:radial-gradient(circle,#7dffaa66,transparent 70%);animation:okf .8s forwards}
@keyframes okf{from{opacity:1}to{opacity:0}}
.okText{position:fixed;left:50%;top:40%;z-index:481;pointer-events:none;font-family:var(--title);font-size:min(16vw,110px);color:#7dffaa;text-shadow:0 0 30px #3fbf6f, 0 6px 0 #0b3a1a;animation:okt 1s forwards}
@keyframes okt{0%{transform:translate(-50%,-50%) scale(2.4);opacity:0}25%{transform:translate(-50%,-50%) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(-50%,-70%) scale(1);opacity:0}}

/* vault */
.vault{background:#000;overflow:hidden}
.vault .half{position:absolute;top:0;bottom:0;width:50.5%;background:
  radial-gradient(circle at 100% 50%, #6b6f75 0 120px, transparent 121px),
  repeating-linear-gradient(0deg,#3c4046 0 4px,#33373c 4px 8px);
  border:6px solid #1b1d20;transition:transform 1.2s cubic-bezier(.7,0,.3,1)}
.vault .l{left:0}
.vault .r{right:0;background:
  radial-gradient(circle at 0% 50%, #6b6f75 0 120px, transparent 121px),
  repeating-linear-gradient(0deg,#3c4046 0 4px,#33373c 4px 8px)}
.vault.open .l{transform:translateX(-102%)}
.vault.open .r{transform:translateX(102%)}
.vault .wheel{position:absolute;left:50%;top:50%;width:200px;height:200px;margin:-100px 0 0 -100px;border-radius:50%;
  border:14px solid #b8bcc2;box-shadow:0 0 0 6px #222, 0 0 40px #000;z-index:3;transition:transform 1s ease-in-out, opacity .5s}
.vault .wheel::before,.vault .wheel::after{content:"";position:absolute;left:50%;top:-14px;bottom:-14px;width:14px;margin-left:-7px;background:#b8bcc2}
.vault .wheel::after{transform:rotate(90deg)}
.vault .wheel i{position:absolute;left:50%;top:50%;width:46px;height:46px;margin:-23px;border-radius:50%;background:#d6d9dd;box-shadow:0 0 0 6px #222;z-index:2}
.vault .light{position:absolute;inset:0;background:radial-gradient(circle,#fff6d6,#ffcf6a 30%,transparent 70%);opacity:0;transition:opacity .8s .6s}
.vault.open .light{opacity:1}
.vault .vtxt{position:absolute;bottom:12%;left:0;right:0;font-family:var(--title);font-size:40px;color:#ffd677;z-index:4;text-shadow:0 0 20px #000}

/* reward */
.reward{text-align:center}
.artFrame{display:inline-block;padding:14px;background:linear-gradient(135deg,#8a6420,#e6c066 30%,#7b5517 55%,#d9b257 80%,#6b4910);box-shadow:0 20px 50px #000, inset 0 0 0 3px #3b2706;margin:8px auto;position:relative}
.artFrame img{display:block;max-width:min(78vw,420px);max-height:36vh;border:4px solid #2a1a05;filter:grayscale(1) brightness(.6) blur(1px);transition:filter 2.6s ease}
.artFrame.restored img{filter:none}
.plate{display:inline-block;margin-top:10px;background:linear-gradient(#e7c56d,#a37a28);color:#2a1a05;padding:6px 18px;font-family:var(--story);font-weight:800;border-radius:3px;box-shadow:0 4px 10px #000a}
.keyReveal{margin:20px auto 0;display:flex;align-items:center;justify-content:center;gap:16px}
.bigKey{width:110px;height:110px;border-radius:14px;background:radial-gradient(#6b4513,#2a1606);border:4px solid var(--gold);display:grid;place-items:center;font-family:var(--title);font-size:70px;color:var(--gold2);text-shadow:0 0 20px #ffb347;animation:stampIn .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes stampIn{from{transform:scale(3) rotate(-25deg);opacity:0}to{transform:none;opacity:1}}
.sparks{position:fixed;inset:0;pointer-events:none;z-index:470}

/* final tiles */
.slots{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.slot{width:62px;height:72px;border-radius:8px;border:3px dashed #8c7a62;display:grid;place-items:center;font-family:var(--title);font-size:38px;color:var(--ink);background:#fffaf0aa;position:relative}
.slot small{position:absolute;top:2px;left:5px;font-size:11px;color:#8c7a62;font-family:var(--body)}
.slot.f{border-style:solid;border-color:var(--red);background:#fffaf0}
.tiles{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:10px}
.tile{width:66px;height:70px;border-radius:8px;font-family:var(--title);font-size:36px;background:linear-gradient(#f3e3bd,#cdb183);color:var(--ink);box-shadow:0 5px 0 #6d5a40}
.tile.used{visibility:hidden}

/* end */
.cert{max-width:640px;margin:0 auto;text-align:center;border:10px double #8a6420}
.cert h1{font-family:var(--title);font-size:52px;color:var(--red);margin:6px 0}
.cert .rank{font-family:var(--title);font-size:30px;color:#8a6420;margin:6px 0}
.stars{font-size:46px;letter-spacing:6px;color:#e0a92d;text-shadow:0 2px 0 #6b4910}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0}
.stats div{background:#00000010;border-radius:6px;padding:10px 4px}
.stats b{display:block;font-family:var(--type);font-size:28px;color:var(--ink)}
.stats span{font-size:14px;color:#6d5a40}
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:8px;margin-top:14px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border:4px solid #8a6420;box-shadow:0 4px 8px #0006}
.lightOut{position:fixed;inset:0;z-index:600;background:#fff6d6;pointer-events:none;animation:lo 2.2s forwards}
@keyframes lo{0%{opacity:0}30%{opacity:1}100%{opacity:0}}

/* lives */
#lives{display:flex;gap:2px;font-size:24px;filter:drop-shadow(0 0 6px #ff2a3a88)}
#lives span.lost{filter:grayscale(1) brightness(.5);opacity:.5}
.heartsBig{font-size:64px;letter-spacing:8px;margin:6px 0}
.heartsBig span.lost{filter:grayscale(1) brightness(.5);opacity:.45}
.heartsBig span.breaking{display:inline-block;animation:hbreak 1.2s forwards}
@keyframes hbreak{0%{transform:scale(1)}30%{transform:scale(1.5)}60%{transform:scale(1.2) rotate(-15deg);filter:none}100%{transform:scale(1);filter:grayscale(1) brightness(.5);opacity:.45}}
.gameover{background:radial-gradient(circle,#1a0003f2,#000f);}
.gameover h1{font-family:var(--title);font-size:min(13vw,80px);color:#ff3a46;margin:0;letter-spacing:4px;text-shadow:0 0 30px #f00;animation:shake .5s 2}
.gameover p{font-size:22px;color:#f2dede;line-height:1.6}
.skull{font-size:90px;animation:bob .6s infinite alternate}
.hardTag{display:inline-block;background:linear-gradient(#e0313a,#8d0d14);color:#fff;font-family:var(--title);font-size:15px;padding:3px 12px;border-radius:14px;margin-right:8px;letter-spacing:1px;box-shadow:0 0 12px #ff3a4688;animation:pulseR 1.4s infinite}
.qcard.hard{box-shadow:0 18px 40px #000c, inset 0 0 60px #8a6a3a55, 0 0 0 3px #b3121b, 0 0 30px #ff2a3a55}
.txtWrap{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap;align-items:center}
.txtWrap .inp{flex:1;min-width:200px;font-size:28px;text-align:center;letter-spacing:6px;user-select:text;-webkit-user-select:text}
.txtWrap .need{width:100%;font-size:16px;color:#6d5a40}
.credit{font-family:var(--hand);font-size:30px;color:#d9a845;letter-spacing:2px;margin-top:4px}
.creditS{font-size:14px;color:#8c7a62;text-align:center;margin-top:10px;letter-spacing:1px}
/* brain puzzles */
.intel{margin:10px 0 12px;background:#1d1611;color:#efe2c8;border-radius:6px;padding:14px 16px 14px 16px;position:relative;font-size:17.5px;line-height:1.65;border-left:6px solid var(--gold);white-space:pre-line}
.intel .it{display:block;font-family:var(--type);color:var(--gold2);letter-spacing:2px;font-size:13px;margin-bottom:6px}
.brainTag{display:inline-block;background:linear-gradient(#6a3fd1,#341a7a);color:#fff;font-family:var(--title);font-size:15px;padding:3px 12px;border-radius:14px;margin-right:8px;letter-spacing:1px;box-shadow:0 0 14px #9b6bff99;animation:pulseP 1.4s infinite}
@keyframes pulseP{50%{box-shadow:0 0 22px #b48cffcc}}
.qcard.brain{box-shadow:0 18px 40px #000c, inset 0 0 60px #8a6a3a55, 0 0 0 3px #6a3fd1, 0 0 34px #9b6bff66}
.extra{margin:12px 0 4px;display:flex;justify-content:center}
.mirror{display:inline-block;transform:scaleX(-1);background:#fffaf0;border:2px dashed #6d5a40;padding:14px 18px;font-family:var(--story);font-weight:800;font-size:22px;line-height:1.6;color:#2a1a05;text-align:left}
.matrix{display:grid;grid-template-columns:repeat(3,auto);gap:6px;background:#111;padding:6px;border-radius:4px}
.matrix svg{display:block;background:#fff}
.qm{width:76px;height:76px;display:grid;place-items:center;background:#fff6c9;font-family:var(--title);font-size:46px;color:var(--red)}
.cipher{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:520px;width:100%}
.cipher div{background:#fffaf0;border:1.5px solid #b49a70;border-radius:4px;text-align:center;padding:4px 0;font-size:20px;font-weight:bold}
.cipher div small{display:block;font-family:var(--type);color:var(--red);font-size:16px}
.code{font-family:var(--type);font-size:30px;background:#1d1611;color:var(--gold2);padding:8px 16px;border-radius:6px;letter-spacing:4px;margin-top:10px;display:inline-block}
.clues{background:#fffaf0;border:2px solid #b49a70;border-radius:6px;padding:12px 16px;font-size:19px;line-height:1.7;width:100%}
.clues b{color:var(--red)}
.opt svg{flex:none}
/* teacher */
.tpanel{background:#16110c;border:2px solid var(--gold);border-radius:10px;padding:20px;max-width:640px;width:100%;max-height:90vh;overflow:auto;text-align:left;color:#efe2c8}
.tpanel h3{font-family:var(--title);color:var(--gold2);margin:0 0 10px;font-size:26px}
.trow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #ffffff15;gap:10px;font-size:18px}
.trow button{background:#2b231b;color:#efe2c8;padding:8px 14px;border-radius:6px;font-size:16px;border:1px solid #fff3}
.trow button.on{background:var(--green);color:#062}
.akey{font-size:15px;line-height:1.6;background:#0006;padding:10px;border-radius:6px;margin-top:10px}
.akey b{color:var(--gold2)}
.cam{position:relative;width:min(92%,520px);margin:12px auto 0;border:8px solid #111;background:#000;aspect-ratio:4/3;overflow:hidden}
.cam video,.cam canvas{width:100%;height:100%;object-fit:cover;transform:scaleX(-1);filter:saturate(1.6) sepia(.35) hue-rotate(-20deg) contrast(1.15)}
.cam .waves{position:absolute;inset:0;pointer-events:none;background:repeating-radial-gradient(ellipse at 50% -20%, #ff5a1f33 0 18px, #ffb40022 18px 36px, #2a4cff22 36px 54px);mix-blend-mode:screen}
.cam .lbl{position:absolute;left:0;right:0;bottom:0;background:#000b;color:#ffd677;font-family:var(--title);padding:6px;font-size:20px}
.cam .cdn{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--title);font-size:120px;color:#fff;text-shadow:0 0 30px #f00}
.bigCount{font-family:var(--type);font-size:110px;color:var(--red);text-align:center;line-height:1}
.dance{font-size:60px;text-align:center;animation:bob .5s infinite alternate}
@keyframes bob{to{transform:translateY(-12px) rotate(6deg)}}
.reflectBox{background:#fffaf0;border:2px solid #b49a70;border-radius:8px;padding:16px;font-size:22px;line-height:1.5;margin-top:12px;font-family:var(--hand);font-size:32px;color:#24324f}
.small{font-size:15px;color:#8c7a62}
</style>
</head>
<body>
<div id="stage">
  <div id="hud">
    <div id="logo">🕵️ 샤프쌤 미술관</div>
    <div id="teamTag"></div>
    <div id="lives"></div>
    <div id="keys"></div>
    <div id="timer">40:00</div>
    <button id="soundBtn" aria-label="소리">🔊</button>
  </div>
  <div id="app"></div>
</div>
<canvas id="dust"></canvas>
<div id="tcorner" style="position:fixed;left:0;top:0;width:70px;height:70px;z-index:950"></div>
<div id="grain"></div>
<div id="vignette"></div>

/* 몬드리안 규칙 퍼즐 그림 */
function mcell(color,corner,size=70){
  const c={red:'#d6262c',blue:'#2f6bd8',yellow:'#f2c912'}[color];const b=26,m=4;
  const pos=[[m,m],[size-m-b,m],[size-m-b,size-m-b],[m,size-m-b]][corner];
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}"><rect x="1.5" y="1.5" width="${size-3}" height="${size-3}" fill="#fff" stroke="#111" stroke-width="3"/><rect x="${pos[0]}" y="${pos[1]}" width="${b}" height="${b}" fill="${c}" stroke="#111" stroke-width="3"/></svg>`;
}
function mondMatrix(){
  const rows=[['red',0],['blue',1],['yellow',2]];let h='<div class="matrix">';
  rows.forEach(([col,st],r)=>{for(let k=0;k<3;k++){h+=(r===2&&k===2)?'<div class="qm">?</div>':mcell(col,(st+k)%4,76)}});
  return h+'</div>';
}
function cipherTable(){
  const c='ㄱㄴㄷㄹㅁㅂㅅㅇㅈㅊㅋㅌㅍㅎ';
  return '<div class="cipher">'+[...c].map((ch,i)=>`<div><small>${i+1}</small>${ch}</div>`).join('')+'</div>';
}

let AC=null, master=null, drone=null;
function audio(){
  if(!AC){try{AC=new (window.AudioContext||window.webkitAudioContext)();master=AC.createGain();master.gain.value=cfg.sound?0.6:0;master.connect(AC.destination);}catch(e){}}
  if(AC&&AC.state==='suspended')AC.resume();
  return AC;
}
function tone(f,d,type='sine',v=.3,t0=0,f2=null){
  if(!audio())return;const t=AC.currentTime+t0;const o=AC.createOscillator(),g=AC.createGain();
  o.type=type;o.frequency.setValueAtTime(f,t);if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(v,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.05);
}
function noise(d,v=.3,freq=1200,t0=0,q=1){
  if(!audio())return;const t=AC.currentTime+t0;const len=Math.floor(AC.sampleRate*d);const b=AC.createBuffer(1,len,AC.sampleRate);const da=b.getChannelData(0);
  for(let i=0;i<len;i++)da[i]=(Math.random()*2-1)*(1-i/len);
  const s=AC.createBufferSource();s.buffer=b;const fl=AC.createBiquadFilter();fl.type='bandpass';fl.frequency.value=freq;fl.Q.value=q;
  const g=AC.createGain();g.gain.value=v;s.connect(fl);fl.connect(g);g.connect(master);s.start(t);
}

/* =========================================================

========================================================= */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function sshuffle(arr,seed){const r=rng(seed);const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function hashStr(t){let h=7;for(const c of t)h=(h*31+c.charCodeAt(0))|0;return h}
function teamSeed(){return S&&S.team?S.team.num*7919:1}
/* 방 안 미션 순서: 🧠두뇌 금고는 항상 마지막, stick:true는 다음 문제와 붙어 다님 */
function roomList(r){
  const blocks=[];let cur=[];
  r.missions.forEach((q,i)=>{cur.push(i);if(!q.stick){blocks.push(cur);cur=[]}});
  if(cur.length)blocks.push(cur);
  const boss=blocks.filter(b=>r.missions[b[0]].brain), rest=blocks.filter(b=>!r.missions[b[0]].brain);
  const order=cfg.shuffleQ?sshuffle(rest,teamSeed()+r.id*101):rest;
  return order.concat(boss).flat();
}

function typewrite(el,text,speed=34,done){

  sfx.correct();

function sparks(n=60,colors=['#ffd677','#fff','#ff6b6b','#7dffaa','#6bc5ff']){
  const c=document.createElement('canvas');c.className='sparks';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const x=c.getContext('2d');const P=[];for(let i=0;i<n;i++)P.push({x:innerWidth/2,y:innerHeight*.42,vx:(Math.random()-.5)*16,vy:Math.random()*-14-3,r:Math.random()*5+2,c:colors[i%colors.length],a:1,rot:Math.random()*6});
  let f=0;(function loop(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.45;p.a-=.012;p.rot+=.2;x.globalAlpha=Math.max(p.a,0);x.fillStyle=p.c;x.save();x.translate(p.x,p.y);x.rotate(p.rot);x.fillRect(-p.r,-p.r/2,p.r*2,p.r);x.restore()});if(++f<110)requestAnimationFrame(loop);else c.remove()})();
}

function route(){
  if(!S)return briefing();
  if(S.finished)return ending(false);
  if(S.phase==='final')return finalRoom();
  if(S.phase==='room')return roomBrief();
  map();
}
function map(){
  S.phase='map';save();hud(true);
  const allDone=S.done.length===ROOMS.length;
  const nowId=allDone?null:curRoom().id;
  const doors=ROOMS.map(r=>{
    const done=S.done.includes(r.id), now=r.id===nowId;
    const step=S.order.indexOf(r.id-1)+1;
    return `<div class="door ${done?'done':now?'now':'locked'}" data-id="${r.id}">
      ${done?`<div class="art" style="background-image:url(${IMG[r.img]})"></div><div class="keyb">${r.key}</div>`:''}
      <div class="num">ROOM ${r.id}</div>

      <div class="nm">${r.name}</div>
      <div class="st">${done?'✔ 탈출 성공':now?'▶ 지금 갈 곳 (터치)':`${step}번째 방문`}</div></div>`}).join('');
  render(`<div class="mapHead"><div><h2>🗺️ 미술관 평면도</h2><p>빛나는 문으로 가세요! (${S.done.length} / ${ROOMS.length} 탈출)</p></div></div>

    <div class="hintBox ${lv?'show':''}" id="hbox">${q.hints.slice(0,lv).map((h,i)=>`<p>${i?'🗝️ 결정적 단서':'🔍 단서'}: ${h}</p>`).join('')}</div>
    <div id="exp"></div></div>`);
  $('#hb').onclick=()=>{
    let l=S.hintLv[qid]||0;if(l>=2)return;l++;S.hintLv[qid]=l;S.hints++;save();sfx.magic();
    $('#hbox').innerHTML=q.hints.slice(0,l).map((h,i)=>`<p>${i?'🗝️ 결정적 단서':'🔍 단서'}: ${h}</p>`).join('');$('#hbox').classList.add('show');
    $('#hb').textContent=l>=2?'🔍 단서 모두 공개됨':'🔍 결정적 단서 보기 (+30초)';
  };
  const success=()=>{
    okFX();
    $('#ans').style.pointerEvents='none';$('#hb').parentElement.style.display='none';
    $('#exp').innerHTML=`<div class="explain">✅ <b>정답!</b> ${q.explain||''}</div><div class="row"><button class="btn gold" id="nx">다음으로 ▶</button></div>`;

  if(q.type==='choice'){
    const L='ABCDEF';

    const go=()=>{const v=($('#tx').value||'').replace(/\s/g,'').toLowerCase();if(!v){$('#tx').focus();return}
      if(q.answers.map(a=>a.replace(/\s/g,'').toLowerCase()).includes(v)){$('#tx').blur();success()}else{$('#tx').value='';fail()}};
    $('#txok').onclick=go;$('#tx').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.isComposing)go()});
  }else if(q.type==='number'){
    keypad($('#ans'),q.len||1,v=>{if(v===q.answer)success();else fail()});
  }else if(q.type==='dial'){
    const vals=q.colors.map(()=>0);
    $('#ans').innerHTML=`<div class="dials">${q.colors.map((c,i)=>`<div class="dial"><div class="sw" style="background:${c[1]}"></div><b style="color:var(--ink)">${c[0]}</b><button data-i="${i}" data-d="1">▲</button><div class="v" id="dv${i}">0</div><button data-i="${i}" data-d="-1">▼</button></div>`).join('')}</div>
      <div class="row"><button class="btn" id="dok">🔓 금고 열기</button></div>`;
    $('#ans').querySelectorAll('.dial button').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;vals[i]=(vals[i]+ +b.dataset.d+10)%10;$('#dv'+i).textContent=vals[i];sfx.tick()});
    $('#dok').onclick=()=>{if(vals.every((v,i)=>v===q.answer[i]))success();else fail()};
  }
}

function keypad(el,len,onSubmit){
  let v='';
  el.innerHTML=`<div class="keypadWrap"><div class="display">${Array(len).fill('<span></span>').join('')}</div>
   <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button class="key" data-k="${n}">${n}</button>`).join('')}<button class="key del" data-k="del">⌫</button><button class="key" data-k="0">0</button><button class="key ok" data-k="ok">확인</button></div></div>`;
  const draw=()=>el.querySelectorAll('.display span').forEach((s,i)=>{s.textContent=v[i]||'';s.classList.toggle('fill',!!v[i])});
  el.querySelectorAll('.key').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;sfx.tick();
    if(k==='del')v=v.slice(0,-1);
    else if(k==='ok'){if(v.length===len){const x=v;v='';draw();onSubmit(x)}else{el.querySelector('.display').classList.add('shake');setTimeout(()=>el.querySelector('.display').classList.remove('shake'),450)}return}
    else if(v.length<len)v+=k;
    draw();
  });
}

    ${all?'<p class="small" style="color:#ffbcbc">타이머는 계속 흐른다! 모은 열쇠도 모두 사라졌다.</p>':'<p class="small" style="color:#ffbcbc">모은 열쇠는 그대로! 타이머는 계속 흐른다.</p>'}

    stopCam();

      <p class="center" style="font-size:20px">${q.mode==='camera'?'카메라가 없어도 괜찮아! 모두 포즈를 유지하라!':'모두 함께 따라 하라!'}</p>

        $('#nx').onclick=()=>{sfx.click();onDone()}}},1000);
    };
  };
  if(q.mode!=='camera')return timerMode();
  act.innerHTML=`<div class="cam" id="cam"><video id="vid" autoplay playsinline muted></video><div class="waves"></div><div class="lbl">📸 절규 증거 사진</div></div>
    <div class="row"><button class="btn" id="shoot" disabled>📸 3초 뒤 찰칵!</button><button class="btn dark" id="nocam">카메라 없이 하기</button></div>`;

        const c=document.createElement('canvas');c.width=v.videoWidth||640;c.height=v.videoHeight||480;c.getContext('2d').drawImage(v,0,0,c.width,c.height);

        setTimeout(()=>{okFX('증거 확보!');

function finalRoom(){
  hud(true);
  if(S.finalStage==='quiz')return finalQuiz();
  const tiles=FINAL_WORD.concat(DECOYS).map((t,i)=>({t,i})).sort(()=>Math.random()-.5);
  let pick=[];
  render(`<div class="paper"><div class="tape"></div><div class="stamp big">FINAL</div>
    <div class="sub">LAST DOOR · 1단계</div><div class="roomTitle">최후의 문</div>
    <div class="story" id="st"></div>
    <div class="slots" id="slots"></div>
    <div class="tiles" id="tiles"></div>
    <div class="row"><button class="btn dark" id="clr">↺ 다시 놓기</button><button class="btn" id="chk">🔓 암호 확인</button></div>
    <p class="small center">활동지에 적은 열쇠 글자를 <b>방 번호 순서(1→8)</b>대로 놓아라. 가짜 글자가 섞여 있다!</p></div>`);
  typewrite($('#st'),'드디어 마지막 문 앞에 섰다. 문에는 8칸의 글자 자물쇠가 걸려 있다.\n팬텀 X의 메시지: "방 번호 순서대로 열쇠를 놓으면 진실이 드러날 것이다."',28);
  const draw=()=>{
    $('#slots').innerHTML=FINAL_WORD.map((_,i)=>`<div class="slot ${pick[i]?'f':''}" data-s="${i}"><small>${i+1}</small>${pick[i]?pick[i].t:''}</div>`).join('');
    $('#tiles').innerHTML=tiles.map((o,k)=>`<button class="tile ${pick.includes(o)?'used':''}" data-k="${k}">${o.t}</button>`).join('');
    $('#tiles').querySelectorAll('.tile').forEach(b=>b.onclick=()=>{if(pick.length<8){pick.push(tiles[+b.dataset.k]);sfx.tick();draw()}});
    $('#slots').querySelectorAll('.slot').forEach(b=>b.onclick=()=>{const i=+b.dataset.s;if(pick[i]){pick.splice(i,1);sfx.tick();draw()}});
  };
  draw();
  $('#clr').onclick=()=>{pick=[];sfx.click();draw()};
  $('#chk').onclick=()=>{
    if(pick.length<8){$('#slots').classList.add('shake');setTimeout(()=>$('#slots').classList.remove('shake'),450);return}
    if(pick.map(p=>p.t).join('')===FINAL_WORD.join('')){
      okFX('그림은 마음의 창문');
      setTimeout(()=>{S.finalStage='quiz';S.finalIdx=0;save();
        render(`<div class="paper center"><div class="stamp big">2단계</div><div class="roomTitle">팬텀 X의 정체</div>
          <div class="story" id="st2" style="text-align:left"></div>
          <div class="row"><button class="btn" id="g" style="display:none">⚔️ 마지막 시험 받기</button></div></div>`);
        typewrite($('#st2'),'"그림은 마음의 창문"…\n문이 덜컹 흔들리며 팬텀 X의 목소리가 울린다.\n\n"훌륭하군, 꼬마 탐정들. 하지만 아직 끝나지 않았다!\n이 미술관에는 아직 너희가 보지 못한 명화들이 있다.\n내가 내는 마지막 시험 '+S.finalQs.length+'개를 통과해야만 나갈 수 있다!"',30,()=>{$('#g').style.display='';});
        $('#g').onclick=()=>{sfx.click();finalQuiz()};
      },1400);
    }else{pick=[];draw();loseLife(null)}
  };
}

     <div class="trow"><span>목숨 개수</span><span><button data-a="l-">−</button> <b style="font-size:22px;margin:0 8px">${cfg.lives}개</b> <button data-a="l+">+</button></span></div>
     <div class="trow"><span>목숨을 모두 잃으면</span><button data-a="lmode" class="on">${cfg.lifeMode==='all'?'게임 맨 처음으로':'그 방 처음으로'}</button></div>
     <div class="trow"><span>문 열기 단계 (작품 연도 입력)</span><button data-a="door" class="${cfg.doorCode?'on':''}">${cfg.doorCode?'켜짐':'꺼짐'}</button></div>
     <div class="trow"><span>모둠별 문제·보기 순서 섞기</span><button data-a="shq" class="${cfg.shuffleQ?'on':''}">${cfg.shuffleQ?'켜짐':'꺼짐'}</button></div>
     <div class="trow"><span>모둠별 출발 방 다르게 (새로 등록할 때 적용)</span><button data-a="rot" class="${cfg.rotate?'on':''}">${cfg.rotate?'켜짐':'꺼짐'}</button></div>
     <div class="trow"><span>소리</span><button data-a="snd" class="${cfg.sound?'on':''}">${cfg.sound?'켜짐':'꺼짐'}</button></div>
     <div class="trow"><span>현재 문제 / 방 건너뛰기</span><button data-a="skip">건너뛰기</button></div>
     <div class="trow"><span>이 태블릿 처음부터 다시 (진행 기록 삭제)</span><button data-a="reset" style="background:#8d0d14">초기화</button></div>
     <div class="trow"><span>정답표</span><button data-a="key">보기/숨기기</button></div>
     <div class="akey" id="ak" style="display:none">${answerKeyHTML()}</div>
     <div class="row"><button class="btn gold" data-a="close">닫기</button></div></div>`;
  };
  draw();document.body.appendChild(ov);
  ov.addEventListener('click',e=>{
    const a=e.target.dataset&&e.target.dataset.a;if(!a)return;sfx.click();
    if(a==='m-'){cfg.minutes=Math.max(10,cfg.minutes-5)}
    if(a==='m+'){cfg.minutes=Math.min(120,cfg.minutes+5)}
    if(a==='door')cfg.doorCode=!cfg.doorCode;
    if(a==='l-'){cfg.lives=Math.max(1,cfg.lives-1);if(S)S.lives=Math.min(S.lives,cfg.lives)}
    if(a==='l+'){cfg.lives=Math.min(5,cfg.lives+1)}
    if(a==='lmode')cfg.lifeMode=cfg.lifeMode==='all'?'room':'all';
    if(a==='shq')cfg.shuffleQ=!cfg.shuffleQ;
    if(a==='rot')cfg.rotate=!cfg.rotate;
    if(a==='snd')setSound(!cfg.sound);
    if(a==='key'){const k=ov.querySelector('#ak');k.style.display=k.style.display==='none'?'block':'none';return}
    if(a==='skip'){if(!S||S.finished)return;skipCurrent();ov.remove();return}
    if(a==='reset'){if(confirmReset()){localStorage.removeItem(SKEY);S=null;ov.remove();stopCam();briefing();}return}
    if(a==='close'){ov.remove();return}
    saveCfg();if(S){save();hud()}draw();
  });
}
let resetArm=0;
function confirmReset(){if(Date.now()-resetArm<3000)return true;resetArm=Date.now();const b=document.querySelector('[data-a="reset"]');if(b)b.textContent='한 번 더 누르면 초기화';return false}
function skipCurrent(){
  stopCam();
  if(S.phase==='final'){
    if(S.finalStage==='tiles'){S.finalStage='quiz';S.finalIdx=0}else S.finalIdx++;
    save();return finalRoom();
  }
  if(S.phase==='room'){
    const r=curRoom();
    if(S.sub==='brief'||S.sub==='door'){S.sub='mission';S.m=0}
    else if(S.sub==='mission'){S.m++;if(S.m>=r.missions.length)S.sub='reflect'}
    else if(S.sub==='reflect'){save();return reward()}
    save();return roomBrief();
  }
  map();
}
function answerKeyHTML(){
  const ans=q=>(q.brain?'🧠':q.hard?'🔥':'')+(q.type==='choice'?(q.options[q.answer].startsWith('<svg')?'노란 네모 왼쪽 위':q.options[q.answer]):q.type==='text'?q.answers[0]:q.type==='number'?q.answer:q.type==='dial'?q.colors.map((c,i)=>c[0]+' '+q.answer[i]).join(', '):'(활동 미션)');
  return ROOMS.map(r=>`<div><b>${r.id}. ${r.name}</b> (${r.art}) — 문: ${r.door.code} / 열쇠: ${r.key}<br>${r.missions.map((q,i)=>`&nbsp;${i+1}) ${ans(q)}`).join('<br>')}</div>`).join('<hr style="border-color:#fff2">')
   +`<hr style="border-color:#fff2"><div><b>최후의 문</b>: ${FINAL_WORD.join('')}</div><div><b>마지막 시험 (★표시는 항상 출제 + 나머지 중 무작위 ${FINAL_RANDOM}개)</b><br>${GALLERY.map(g=>`&nbsp;${g.fixed?'★':'·'} ${g.art}: ${ans(g)}`).join('<br>')}</div>`;
}

/* =========================================================
   배경 먼지 & 필름 노이즈
========================================================= */
(function(){
  const n=document.createElement('canvas');n.width=n.height=160;const x=n.getContext('2d');const d=x.createImageData(160,160);
  for(let i=0;i<d.data.length;i+=4){const v=Math.random()*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}
  x.putImageData(d,0,0);$('#grain').style.background=`url(${n.toDataURL()})`;
  const c=$('#dust'),cx=c.getContext('2d');let P=[];
  const rs=()=>{c.width=innerWidth;c.height=innerHeight;P=Array.from({length:40},()=>({x:Math.random()*c.width,y:Math.random()*c.height,r:Math.random()*1.8+.3,vx:(Math.random()-.5)*.25,vy:-Math.random()*.3-.05,a:Math.random()*.5+.1}))};
  rs();addEventListener('resize',rs);
  (function loop(){cx.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.y<0){p.y=c.height;p.x=Math.random()*c.width}cx.fillStyle=`rgba(255,220,160,${p.a})`;cx.beginPath();cx.arc(p.x,p.y,p.r,0,7);cx.fill()});requestAnimationFrame(loop)})();
})();

/* 시작 */
setSound(cfg.sound);
document.addEventListener('pointerdown',()=>audio(),{once:true});
intro();
</script>
</body>
